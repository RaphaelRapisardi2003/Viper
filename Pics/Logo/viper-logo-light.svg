<!-- VIPER Brand Identity Vector Logo -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#FAF9F6"/>
  <g transform="translate(400, 250)" text-anchor="middle" dominant-baseline="central">

    <!-- Stacked Master Brand Layout -->
    <g transform="translate(-50, -140)">
      <!-- Dynamic Selected Abstract Vector Icon -->

        <path d="M22,30 L45,75 L68,30" stroke="#1E201E" stroke-width="1.2" fill="none" />
        <path d="M32,30 L55,75 L78,30" opacity="0.5" stroke="#1E201E" stroke-width="1.2" fill="none" />
        <line x1="18" y1="30" x2="26" y2="30" stroke="#1E201E" stroke-width="0.8" />
        <line x1="28" y1="30" x2="36" y2="30" stroke="#1E201E" stroke-width="0.8" opacity="0.5" />
        <line x1="64" y1="30" x2="72" y2="30" stroke="#1E201E" stroke-width="0.8" />
        <line x1="74" y1="30" x2="82" y2="30" stroke="#1E201E" stroke-width="0.8" opacity="0.5" />

    </g>
    <text y="20" font-family="serif" font-size="48" font-weight="300" fill="#1E201E" style="letter-spacing: 35px; font-family: 'Playfair Display', serif;">
      VIPER
    </text>
    <line x1="-80" y1="60" x2="80" y2="60" stroke="#1E201E" stroke-width="0.8" opacity="0.25"/>
    <text y="80" font-family="sans-serif" font-size="10" font-weight="300" fill="#1E201E" style="letter-spacing: 14px; opacity: 0.8;">
      MILANO
    </text>

  </g>
</svg>
